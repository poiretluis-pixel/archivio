<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d5c57">
<title>Archivio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d5c57'/%3E%3Cpath d='M18 46V22a4 4 0 0 1 4-4h8l4 5h8a4 4 0 0 1 4 4v19a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4z' fill='%23fff'/%3E%3C/svg%3E">
<!-- Versione costruita il 2026-10-15. Sorgenti e formato dei dati: vedi LEGGIMI.md -->
<style>
:root{
  --fondo:#e9eeec; --carta:#ffffff; --inchiostro:#12211f; --inchiostro2:#465955; --tenue:#6f807c; --linea:#d5dedb; --linea2:#e6ecea;
  --marca:#0d5c57; --marca-su:#ffffff; --marca-tenue:#dcebe8; --serie:#2a78d6; --serie2:#eb6834;
  --ok:#0a7d0a; --attenzione:#8a5a00; --critico:#c0302f; --critico-tenue:#fbeaea; --attenzione-tenue:#fdf3d9;
  --titoli:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --testo:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#0e1514; --carta:#172120; --inchiostro:#eef4f2; --inchiostro2:#bccac6; --tenue:#8c9c98; --linea:#2b3937; --linea2:#212d2b;
  --marca:#5fc0b8; --marca-su:#04201d; --marca-tenue:#1d3330; --serie:#3987e5; --serie2:#d95926;
  --ok:#3fc13f; --attenzione:#f0b429; --critico:#f07a79; --critico-tenue:#3a1e1e; --attenzione-tenue:#3a2f12;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--inchiostro);font:16px/1.5 var(--testo)}
h1,h2,h3,.marchio{font-family:var(--titoli);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.15;margin:0}
h2{font-size:1.2rem;margin:0 0 .7rem}
h3{font-size:1.08rem;margin:0 0 .4rem}
p{margin:.4rem 0}
a{color:var(--marca)}
.num{font-variant-numeric:tabular-nums}
.attenuato{color:var(--tenue)} .piccolo{font-size:.86rem} .destra{text-align:right} .sotto{color:var(--inchiostro2);margin:.25rem 0 0}
.largo-testo{max-width:68ch} .testo-lungo{white-space:pre-wrap;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px;border-radius:4px}

/* guscio: le cartelle sono linguette che si agganciano al foglio */
.guscio{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh;max-width:1280px;margin:0 auto}
.barra{grid-column:1/-1;display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;min-width:0}
.barra .btn{white-space:nowrap}
.chi{min-width:0;flex-shrink:1}
.marchio{font-size:1.35rem;color:var(--inchiostro);text-decoration:none}
.marchio.grande{font-size:2.1rem;margin-bottom:.3rem}
.spazio{flex:1}
.chi,.chi-solo{font-size:.92rem;color:var(--inchiostro2)}
.menu{padding:.5rem 0 2rem 1rem;display:flex;flex-direction:column;gap:2px}
.menu a{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem .9rem;color:var(--inchiostro2);text-decoration:none;border-radius:10px 0 0 10px;border:1px solid transparent;border-right:0}
.menu a:hover{color:var(--inchiostro);background:var(--linea2)}
.menu a.attiva{background:var(--carta);color:var(--inchiostro);font-weight:600;border-color:var(--linea);box-shadow:inset 4px 0 0 var(--marca);position:relative;z-index:1;margin-right:-1px}
.menu-gruppo{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);padding:1rem .9rem .25rem}
.conta{background:var(--marca);color:var(--marca-su);border-radius:99px;font-size:.75rem;font-weight:600;padding:0 .5rem;line-height:1.4rem;min-width:1.4rem;text-align:center}
#vista{background:var(--carta);border:1px solid var(--linea);border-radius:0 14px 14px 14px;padding:1.6rem 1.8rem 3rem;margin:0 1rem 1.5rem 0;min-width:0}
.testa{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.3rem}
.briciole{font-size:.9rem;color:var(--tenue);margin:0 0 .5rem}

.pannello{border-top:1px solid var(--linea);padding:1.15rem 0 .4rem;margin-top:1.1rem}
.dati{display:flex;flex-wrap:wrap;gap:.5rem 2.6rem;margin:.2rem 0 .6rem}
.dato-etichetta{font-size:.88rem;color:var(--inchiostro2)}
.dato-valore{font-family:var(--titoli);font-size:1.75rem;line-height:1.2}
.dato-nota{font-size:.86rem;color:var(--tenue)}
.dato.allerta .dato-valore{color:var(--critico)}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem;margin:1.2rem 0}
.scheda{display:block;border:1px solid var(--linea);border-radius:12px;padding:.9rem 1rem;text-decoration:none;color:inherit;background:var(--carta)}
.scheda:hover{border-color:var(--marca)}
.scheda .dato-valore{font-size:1.4rem}
.elenco{list-style:none;margin:0;padding:0}
.elenco>li{padding:.6rem 0;border-bottom:1px solid var(--linea2)}
.elenco>li:last-child{border-bottom:0}
.elenco a{text-decoration:none;color:inherit;font-weight:600}
.elenco-nota{color:var(--inchiostro2);font-size:.93rem;margin-top:.15rem}
.tra{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem 1rem;flex-wrap:wrap}
.cliccabile{cursor:pointer}
li.cliccabile:hover strong{color:var(--marca)}
.stato{display:inline-flex;align-items:baseline;gap:.4rem;font-size:.93rem}
.stato-segno{display:inline-grid;place-items:center;width:1.25rem;height:1.25rem;border-radius:50%;font-size:.75rem;font-weight:700;flex:none;transform:translateY(-1px)}
.stato.ok .stato-segno{background:var(--ok);color:var(--carta)}
.stato.ritardo .stato-segno{background:var(--critico);color:var(--carta)}
.stato.vuota .stato-segno{border:1.5px solid var(--tenue);color:var(--tenue);font-size:.6rem}
.sezioni{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.4rem 1.5rem}
.sezione{display:flex;align-items:center;gap:.5rem;padding:.3rem 0}
.sezione .btn{margin-left:auto}
details{border-bottom:1px solid var(--linea2);padding:.5rem 0}
summary{cursor:pointer;font-weight:600;padding:.2rem 0}

.btn{font:inherit;font-size:.93rem;padding:.48rem .9rem;border-radius:9px;border:1px solid var(--linea);background:var(--carta);color:var(--inchiostro);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{border-color:var(--marca)}
.btn.primario{background:var(--marca);border-color:var(--marca);color:var(--marca-su);font-weight:600}
.btn.primario:hover{filter:brightness(1.08)}
.btn.piatto{border-color:transparent;background:none;color:var(--inchiostro2)}
.btn.piatto:hover{background:var(--linea2)}
.btn.piccolo{font-size:.84rem;padding:.25rem .6rem}
.btn.pericolo{color:var(--critico);border-color:var(--critico)}
.btn:disabled{opacity:.6;cursor:wait}
.spia::before{content:"";display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.45rem;background:var(--tenue)}
.spia.ok::before{background:var(--ok)} .spia.ko::before{background:var(--critico)}
.azioni{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}
.azioni.colonna{flex-direction:column;align-items:stretch}
.azioni-riga{white-space:nowrap} .azioni-riga .btn{margin-left:.25rem}

.scorri{overflow-x:auto;margin:.4rem 0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{text-align:left;font-weight:600;color:var(--inchiostro2);font-size:.84rem;padding:.4rem .7rem .4rem 0;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:.5rem .7rem .5rem 0;border-bottom:1px solid var(--linea2);vertical-align:top}
th.destra,td.destra{text-align:right}
tbody tr[tabindex]{cursor:pointer}
tbody tr[tabindex]:hover td{background:var(--linea2)}
td.fuori{color:var(--critico);font-weight:600}
.segno-fuori{font-size:.7rem}
.nonspezza{white-space:nowrap} .unita{color:var(--tenue);font-weight:400} td.rif{min-width:9rem;color:var(--inchiostro2)}
.azioni.stretta{margin:.35rem 0 0}
.indice-testa{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;margin:.4rem 0 1rem}
.indice-giudizio{font-size:1.05rem;font-weight:600;margin:0 0 .3rem}
.anello-fondo{fill:none;stroke:var(--linea2);stroke-width:12}
.anello-valore{fill:none;stroke:var(--ok);stroke-width:12;stroke-linecap:round}
.anello.vuota .anello-valore{stroke:var(--attenzione)} .anello.ritardo .anello-valore{stroke:var(--critico)}
.anello-numero{font-family:var(--titoli);font-size:38px;font-weight:600;fill:var(--inchiostro)}
.anello-unita{font-size:11px;fill:var(--tenue)}
.componenti{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem 2rem}
.componente .tra{flex-wrap:nowrap}
.componente .rip-pista{display:block;height:8px;background:var(--linea2);border-radius:4px;margin:.35rem 0 .3rem;overflow:hidden}
.componente .rip-barra{border-radius:4px;background:var(--ok)}
.componente .rip-barra.vuota{background:var(--attenzione)} .componente .rip-barra.ritardo{background:var(--critico)}
/* Barre di avanzamento in elenchi (obiettivi, tetti di spesa) */
.elenco .rip-pista{display:block;height:8px;background:var(--linea2);border-radius:4px;margin:.4rem 0 .25rem;overflow:hidden}
.elenco .rip-barra{border-radius:4px;background:var(--ok)}
.elenco .rip-barra.vuota{background:var(--attenzione)} .elenco .rip-barra.ritardo{background:var(--critico)}
.num.fuori{color:var(--critico);font-weight:600}
.consigli>li{display:grid;grid-template-columns:2rem 1fr;gap:.6rem;align-items:start}
.consiglio-num{display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--marca-tenue);color:var(--marca);font-weight:700;font-size:.9rem}
.md h2{font-size:1.45rem;margin:1.4rem 0 .5rem} .md h3{font-size:1.15rem;margin:1.2rem 0 .4rem} .md h4,.md h5{font-size:1rem;margin:1rem 0 .3rem}
.md p,.md li{line-height:1.6} .md ul,.md ol{padding-left:1.3rem} .md li{margin:.2rem 0}
.md code,code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--linea2);border-radius:4px;padding:0 .25rem}
article.largo-testo{max-width:72ch}
.cerca{width:100%;max-width:320px}
input,select,textarea{font:inherit;color:inherit;background:var(--carta);border:1px solid var(--linea);border-radius:9px;padding:.5rem .65rem;max-width:100%}
input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:var(--marca)}
textarea{width:100%;resize:vertical}
.scheda-testo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem;line-height:1.55}
.modulo{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem 1rem;margin:.6rem 0}
.campo{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem;color:var(--inchiostro2)}
.campo input,.campo select,.campo textarea{color:var(--inchiostro);font-size:1rem}
.campo.riga{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:.5rem}
.campo.stretto{max-width:330px;margin-top:.8rem}
.intero{grid-column:1/-1}
.spunta{display:inline-flex;align-items:center;gap:.45rem;margin:.15rem 1rem .15rem 0;font-size:.93rem}
fieldset{border:1px solid var(--linea);border-radius:9px;padding:.6rem .8rem}
legend{font-size:.88rem;color:var(--inchiostro2);padding:0 .3rem}
.errore{color:var(--critico);font-size:.93rem}
.errore:empty{display:none}
.vuoto{border:1px dashed var(--linea);border-radius:12px;padding:1.1rem 1.2rem;color:var(--inchiostro2);max-width:68ch}
.zona-carica{border:1.5px dashed var(--linea);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.5rem}
.zona-carica.sopra{border-color:var(--marca);background:var(--marca-tenue)}
.ricevuta .esito-ok{font-weight:600;color:var(--ok)} .ricevuta .esito-ko{font-weight:600;color:var(--critico)}

.velo{position:fixed;inset:0;background:rgba(8,20,18,.5);display:grid;place-items:start center;padding:4vh 12px;overflow:auto;z-index:20}
.finestra{background:var(--carta);border-radius:14px;width:min(560px,100%);border:1px solid var(--linea)}
.finestra.larga{width:min(860px,100%)}
.finestra-testa{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--linea)}
.finestra-testa h2{margin:0}
.finestra-corpo{padding:.9rem 1.2rem 1.2rem}
.visore{width:100%;height:70vh;border:1px solid var(--linea);border-radius:8px}
.visore-img{max-width:100%;border-radius:8px}
#avvisi{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:.4rem;z-index:30;width:min(520px,calc(100% - 24px))}
.avviso{background:var(--inchiostro);color:var(--carta);padding:.7rem 1rem;border-radius:10px;font-size:.93rem}
.avviso.errore{background:var(--critico);color:#fff}

.grafico{position:relative;width:100%;min-height:40px}
.grafico svg{display:block;touch-action:pan-y}
.g-griglia{stroke:var(--linea2);stroke-width:1}
.g-base{stroke:var(--linea);stroke-width:1}
.g-asse{fill:var(--tenue);font-size:11.5px;font-variant-numeric:tabular-nums}
.g-linea{fill:none;stroke:var(--serie);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.g-punto{fill:var(--serie);stroke:var(--carta);stroke-width:2}
.g-fuori,.g-punto-fuori{fill:var(--critico);stroke:var(--carta);stroke-width:2}
.g-banda{fill:var(--serie);opacity:.11}
.g-cursore{stroke:var(--tenue);stroke-width:1;stroke-dasharray:3 3}
.g-barra1{fill:var(--serie)} .g-barra2{fill:var(--serie2)}
.g-fumetto{position:absolute;pointer-events:none;background:var(--inchiostro);color:var(--carta);border-radius:8px;padding:.4rem .6rem;font-size:.82rem;line-height:1.35;white-space:nowrap;z-index:5}
.g-f-titolo{opacity:.75} .g-f-forte{font-weight:700;font-size:.95rem}
.legenda{display:flex;gap:1rem;font-size:.86rem;color:var(--inchiostro2);margin:.2rem 0 .4rem}
.chiave{display:inline-block;width:.75rem;height:.75rem;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
i.g-barra1{background:var(--serie)} i.g-barra2{background:var(--serie2)}
.scintilla{display:block}
.ripartizione{display:grid;gap:.45rem;margin:.5rem 0}
.rip-riga{display:grid;grid-template-columns:minmax(90px,200px) 1fr auto;gap:.8rem;align-items:center;font-size:.93rem}
.rip-pista{height:12px}
.rip-barra{display:block;height:100%;background:var(--serie);border-radius:0 4px 4px 0;min-width:3px}

.blocco{min-height:100vh;display:grid;place-items:center;padding:20px}
.blocco-scheda{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:1.8rem;width:min(460px,100%)}
.promemoria{background:var(--marca-tenue);border-radius:9px;padding:.5rem .7rem;font-size:.93rem;margin:0}
.collegamenti{display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.8rem}
.forza{font-size:.86rem;margin-top:-.4rem}
.forza.debole{color:var(--critico)} .forza.media{color:var(--attenzione)} .forza.buona{color:var(--ok)}
.codice-box .codice{font-size:1.25rem;font-weight:700;letter-spacing:.04em;background:var(--marca-tenue);border-radius:10px;padding:.8rem 1rem;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace}

@media (max-width:820px){
  .guscio{grid-template-columns:minmax(0,1fr)}
  .barra{padding:.6rem 16px}
  .menu{flex-direction:row;overflow-x:auto;padding:0 16px .5rem;gap:.3rem;scrollbar-width:none}
  .menu a{white-space:nowrap;border-radius:99px;border:1px solid var(--linea);padding:.35rem .8rem;font-size:.92rem;background:var(--carta)}
  .menu a.attiva{box-shadow:none;background:var(--marca);border-color:var(--marca);color:var(--marca-su);margin-right:0}
  .menu a.attiva .conta{background:var(--marca-su);color:var(--marca)}
  .menu-gruppo{display:none}
  #vista{border-radius:14px;margin:0 8px 16px;padding:1.1rem 16px 2.5rem}
  h1{font-size:1.55rem}
  .solo-largo{display:none}
  .barra{gap:.4rem}
  .spia-testo{display:none} .spia::before{margin-right:0}
  td.rif{min-width:7rem}
  .rip-riga{grid-template-columns:minmax(70px,110px) 1fr auto}
}
@media (prefers-reduced-motion:no-preference){.btn,.menu a,.scheda{transition:border-color .12s,background-color .12s}}
@media print{.barra,.menu,.azioni,.btn{display:none!important}#vista{border:0}}
/* Da fare: etichette del tipo di voce e filtri per casella */
.etichetta-tipo{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.02em;border-radius:4px;padding:0 .4rem;line-height:1.3rem;vertical-align:.1em}
.e-mail{background:var(--attenzione-tenue);color:var(--attenzione)}
.e-cosa{background:var(--marca-tenue);color:var(--marca)}
.filtri{flex-wrap:wrap;align-items:center;margin:0 0 1rem}
li.lavoro .azioni{flex-wrap:wrap}
.scadenza-rapida{display:inline-flex;align-items:center;gap:.35rem}
.scadenza-rapida input{font:inherit;font-size:.85rem;padding:.15rem .35rem;border:1px solid var(--linea);border-radius:6px;background:var(--carta);color:var(--inchiostro)}
/* Etichette di chi riguarda task e mail */
:root{--e-blu-f:#dce8fb;--e-blu-t:#1a4d9e;--e-giallo-f:#fbefc4;--e-giallo-t:#7a5800;--e-rosso-f:#fbe1e0;--e-rosso-t:#a8282a;--e-viola-f:#ebe3fa;--e-viola-t:#5b3a9e;--e-verde-f:#dcf1e1;--e-verde-t:#1f6b35;--e-grigio-f:var(--linea2);--e-grigio-t:var(--inchiostro2)}
@media (prefers-color-scheme:dark){:root{--e-blu-f:#1c2f4d;--e-blu-t:#9cc1ff;--e-giallo-f:#3b3112;--e-giallo-t:#f3cf5d;--e-rosso-f:#3f1f20;--e-rosso-t:#ff9c9a;--e-viola-f:#2e2443;--e-viola-t:#c7b0ff;--e-verde-f:#16331f;--e-verde-t:#86d79c}}
.etichetta{display:inline-block;font-size:.76rem;font-weight:600;border-radius:99px;padding:0 .55rem;line-height:1.45rem;white-space:nowrap;vertical-align:.08em}
.e-blu{background:var(--e-blu-f);color:var(--e-blu-t)}
.e-giallo{background:var(--e-giallo-f);color:var(--e-giallo-t)}
.e-rosso{background:var(--e-rosso-f);color:var(--e-rosso-t)}
.e-viola{background:var(--e-viola-f);color:var(--e-viola-t)}
.e-verde{background:var(--e-verde-f);color:var(--e-verde-t)}
.e-grigio{background:var(--e-grigio-f);color:var(--e-grigio-t)}
.titolo-lavoro{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem}
.filtro{font:inherit;font-size:.84rem;border:1px solid transparent;background:none;border-radius:99px;padding:.15rem .3rem;cursor:pointer;color:var(--inchiostro2)}
.filtro.scelto{border-color:var(--marca);background:var(--marca-tenue)}
.filtro:hover{border-color:var(--linea)}
/* Schede Oggi, Coda, Archivio */
.schede{display:flex;gap:.3rem;border-bottom:1px solid var(--linea);margin:.5rem 0 1rem;overflow-x:auto}
.schede a{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem .9rem;color:var(--inchiostro2);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.schede a:hover{color:var(--inchiostro)}
.schede a.attiva{color:var(--marca);border-bottom-color:var(--marca);font-weight:600}
.schede .conta{background:var(--linea2);color:var(--inchiostro2)}

<script>
'use strict';
/* ===== 1. Utilità di base ===== */
const $ = (s, r = document) => r.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const PROP = new Set(['value', 'checked', 'disabled', 'selected', 'required', 'hidden', 'multiple', 'open']);

function _el(el, attrs, kids) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (PROP.has(k) && !(el instanceof SVGElement)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = c => {
    if (c == null || c === false || c === '') return;
    if (Array.isArray(c)) c.forEach(add);
    else el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  return el;
}
/* Tutti i dati dell'utente passano da qui come testo, mai come HTML. */
const h = (tag, attrs, ...kids) => _el(document.createElement(tag), attrs, kids);
const s = (tag, attrs, ...kids) => _el(document.createElementNS(SVGNS, tag), attrs, kids);

const adesso = () => new Date().toISOString();
const oggi = () => { const d = new Date(); return isoData(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const isoData = (y, m, d) => `${String(y).padStart(4, '0')}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join(''));
const MS_G = 86400000;
const tempo = iso => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
const giorniDa = iso => Math.floor((tempo(oggi()) - tempo(iso.slice(0, 10))) / MS_G);
const giorniDaSe = iso => (iso ? giorniDa(iso) : NaN); /* per le date facoltative: senza data nessun ritardo */

const _fd = new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const _fm = new Intl.DateTimeFormat('it-IT', { month: 'short', year: '2-digit', timeZone: 'UTC' });
const fmtData = iso => (iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? _fd.format(new Date(tempo(iso))) : (iso || ''));
const fmtMese = ym => _fm.format(new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1)));
const fmtQuando = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('it-IT', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
function fmtNum(n, dec = 2) {
  if (n == null || n === '' || isNaN(n)) return '';
  return Number(n).toLocaleString('it-IT', { maximumFractionDigits: dec });
}
const fmtEuro = n => (n == null || isNaN(n) ? '' : Number(n).toLocaleString('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }));
const fmtDim = b => (b > 1048576 ? fmtNum(b / 1048576, 1) + ' MB' : fmtNum(Math.max(1, Math.round(b / 1024)), 0) + ' kB');
function fa(giorni) {
  if (giorni <= 0) return 'oggi';
  if (giorni === 1) return 'ieri';
  if (giorni < 60) return `${giorni} giorni fa`;
  if (giorni < 730) return `${Math.round(giorni / 30)} mesi fa`;

}

/* Lettura tollerante di numeri e date scritti in formati diversi (file CSV di banche, dispositivi, laboratori). */
function leggiNum(x) {
  if (typeof x === 'number') return isFinite(x) ? x : null;
  if (x == null) return null;
  let t = String(x).trim().replace(/[\s€$£% ]/g, '').replace(/^\+/, '');
  if (!t || !/^-?[\d.,]+$/.test(t)) return null;
  const v = t.lastIndexOf(','), p = t.lastIndexOf('.');
  if (v >= 0 && p >= 0) t = v > p ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else if (v >= 0) t = /^-?\d{1,3}(,\d{3}){2,}$/.test(t) ? t.replace(/,/g, '') : t.replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3}){2,}$/.test(t)) t = t.replace(/\./g, '');
  const n = Number(t);
  return isFinite(n) ? n : null;
}
/* In una colonna, "12,450" è dodicimila se accanto ci sono interi di almeno tre cifre (passi, calorie), altrimenti è un decimale. */
function lettoreColonna(valori) {
  const v = valori.map(x => String(x == null ? '' : x).trim()).filter(Boolean);
  const conVirgola = v.filter(x => x.includes(','));
  const migliaia = conVirgola.length > 0 && conVirgola.every(x => /^-?\d{1,3}(,\d{3})+$/.test(x)) && v.some(x => /^-?\d{3,}$/.test(x)) && !v.some(x => /\d\.\d/.test(x) && x.includes(','));
  return migliaia ? x => leggiNum(String(x == null ? '' : x).replace(/,/g, '')) : leggiNum;
}
const MESI = { gen: 1, feb: 2, mar: 3, apr: 4, mag: 5, giu: 6, lug: 7, ago: 8, set: 9, ott: 10, nov: 11, dic: 12, jan: 1, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, dec: 12 };
function leggiData(x) {
  if (!x) return null;
  const t = String(x).trim();
  let m;
  const ok = (y, mo, d) => (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y > 1900 && y < 2200 ? isoData(y, mo, d) : null);
  if ((m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  if ((m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) return ok(+m[3], +m[2], +m[1]);
  if ((m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2})(?!\d)/))) return ok(2000 + +m[3], +m[2], +m[1]);
  if ((m = t.match(/^(\d{1,2})\s+([a-zA-Z]{3})[a-zA-Z]*\.?,?\s+(\d{4})/)) && MESI[m[2].toLowerCase()]) return ok(+m[3], MESI[m[2].toLowerCase()], +m[1]);
  if ((m = t.match(/^([a-zA-Z]{3})[a-zA-Z]*\.?\s+(\d{1,2}),?\s+(\d{4})/)) && MESI[m[1].toLowerCase()]) return ok(+m[3], MESI[m[1].toLowerCase()], +m[2]);
  return null;
}

const cod = new TextEncoder(), decod = new TextDecoder();
function b64(bytes) {
  const u = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let t = '';
  for (let i = 0; i < u.length; i += 0x8000) t += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(t);
}
function daB64(t) {
  const bin = atob(String(t).replace(/\s/g, ''));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function scarica(nome, contenuto, mime = 'application/octet-stream') {
  const url = URL.createObjectURL(contenuto instanceof Blob ? contenuto : new Blob([contenuto], { type: mime }));
  const a = h('a', { href: url, download: nome });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
const leggiFile = (f, come = 'text') => (come === 'text' ? f.text() : f.arrayBuffer());
function raggruppa(lista, chiave) {
  const m = new Map();
  for (const x of lista) { const k = chiave(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}
const somma = l => l.reduce((a, b) => a + (Number(b) || 0), 0);
const perData = (a, b) => (a.data || '').localeCompare(b.data || '');
const nomeFile = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'file';

/* CSV: riconosce da solo il separatore e gestisce le virgolette. */
function leggiCsv(testo) {
  testo = testo.replace(/^﻿/, '');
  const prima = testo.split(/\r?\n/, 1)[0];
  const sep = [';', '\t', ','].map(c => [c, prima.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const righe = []; let riga = [], campo = '', q = false;
  for (let i = 0; i < testo.length; i++) {
    const c = testo[i];
    if (q) { if (c === '"') { if (testo[i + 1] === '"') { campo += '"'; i++; } else q = false; } else campo += c; }
    else if (c === '"') q = true;
    else if (c === sep) { riga.push(campo); campo = ''; }
    else if (c === '\n') { riga.push(campo); righe.push(riga); riga = []; campo = ''; }
    else if (c !== '\r') campo += c;
  }
  if (campo !== '' || riga.length) { riga.push(campo); righe.push(riga); }
  const piene = righe.filter(r => r.some(x => x.trim() !== ''));
  return { intestazioni: (piene[0] || []).map(x => x.trim()), righe: piene.slice(1) };
}
function creaCsv(intestazioni, righe) {
  const q = v => { const t = v == null ? '' : String(v); return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  return '﻿' + [intestazioni, ...righe].map(r => r.map(q).join(';')).join('\r\n');
}

/* ===== 2. Cifratura =====
   Schema: una chiave dati casuale (256 bit) cifra tutto con AES-256-GCM.
   La chiave dati è a sua volta cifrata in uno o più "slot", ognuno apribile con un segreto
   (frase segreta oppure codice di recupero) tramite PBKDF2-HMAC-SHA256.
   Cambiare frase significa riscrivere solo lo slot, non i dati. Il formato è descritto in LEGGIMI.md. */
const ITERAZIONI = 600000;
const casuale = n => crypto.getRandomValues(new Uint8Array(n));
const normFrase = t => String(t).normalize('NFKC').trim();
const normCodice = t => String(t).toUpperCase().replace(/[^A-Z0-9]/g, '');

async function chiaveDaSegreto(segreto, sale, iter) {
  const base = await crypto.subtle.importKey('raw', cod.encode(segreto), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sale, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function creaSlot(tipo, segreto, chiaveDati) {
  const sale = casuale(16), iv = casuale(12);
  const k = await chiaveDaSegreto(tipo === 'recupero' ? normCodice(segreto) : normFrase(segreto), sale, ITERAZIONI);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, chiaveDati);
  return { tipo, kdf: 'PBKDF2-HMAC-SHA256', iterazioni: ITERAZIONI, sale: b64(sale), iv: b64(iv), chiave: b64(ct), creato: adesso() };
}
async function apriSlot(slot, segreto) {
  const k = await chiaveDaSegreto(slot.tipo === 'recupero' ? normCodice(segreto) : normFrase(segreto), daB64(slot.sale), slot.iterazioni);
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: daB64(slot.iv) }, k, daB64(slot.chiave)));
}
const importaChiaveDati = grezza => crypto.subtle.importKey('raw', grezza, 'AES-GCM', false, ['encrypt', 'decrypt']);

async function flusso(bytes, trasformazione) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(trasformazione)).arrayBuffer());
}
const haGzip = typeof CompressionStream !== 'undefined';

/* Busta: il file che finisce su disco e nel cloud. Contiene solo testo cifrato più i parametri per riaprirlo. */
async function sigilla(oggetto, chiave, testata) {
  let chiaro = cod.encode(JSON.stringify(oggetto));
  if (haGzip) chiaro = await flusso(chiaro, new CompressionStream('gzip'));
  const iv = casuale(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chiave, chiaro);
  return {
    formato: 'archivio-vita', versione: 1, promemoria: testata.promemoria || '', slot: testata.slot, slot_agg: testata.slot_agg,
    cifra: 'AES-256-GCM', compressione: haGzip ? 'gzip' : 'nessuna', iv: b64(iv), dati: b64(ct), salvato: adesso(),
  };
}
async function dissigilla(busta, chiave) {
  let chiaro = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: daB64(busta.iv) }, chiave, daB64(busta.dati)));
  if (busta.compressione === 'gzip') chiaro = await flusso(chiaro, new DecompressionStream('gzip'));
  return JSON.parse(decod.decode(chiaro));
}
/* Allegati: 12 byte di IV seguiti dal testo cifrato, con la stessa chiave dati. */
async function cifraBytes(bytes, chiave) {
  const iv = casuale(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chiave, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return out;
}
async function decifraBytes(bytes, chiave) {
  const u = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, chiave, u.subarray(12)));
}
function forzaFrase(t) {
  const n = normFrase(t).length;
  if (n === 0) return null;
  if (n < 10) return { livello: 'debole', testo: 'Debole: meno di 10 caratteri si indovina in poco tempo se il file cifrato finisce in mani sbagliate.' };
  if (n < 16 && !/\s/.test(t.trim())) return { livello: 'media', testo: 'Discreta. Meglio una frase di 4 o 5 parole.' };
  return { livello: 'buona', testo: 'Buona.' };
}

/* ===== 3. Archivio: stato in memoria e salvataggio locale cifrato =====
   S.A    : l'archivio vero e proprio, identico ad archivio.json nel repository dei dati.
   S.est  : dati scritti da altri (Garmin, rapporti di Claude), letti dal repository e mai riscritti dalla pagina.
   S.disp : impostazioni di questo dispositivo (token di GitHub). Restano solo qui, cifrate. */
const S = {
  sbloccato: false, chiave: null, chiaveGrezza: null, testata: null, A: null, est: {}, disp: {}, estVoci: [],
  persona: '', sync: { stato: 'spento', ultimo: null, errore: '' }, sporco: false, ultimaAttivita: Date.now(),
};
const SCHEMA = 'archivio-vita/1';

/* IndexedDB: 'kv' per la busta e le note locali del dispositivo, 'blob' per gli allegati cifrati. */
let _db;
function db() {
  return _db || (_db = new Promise((ok, ko) => {
    const r = indexedDB.open('archivio-vita', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('blob'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }));
}
async function idb(negozio, modo, fn) {
  const d = await db();
  return new Promise((ok, ko) => {
    const tx = d.transaction(negozio, modo); const rq = fn(tx.objectStore(negozio));
    tx.oncomplete = () => ok(rq ? rq.result : undefined); tx.onerror = tx.onabort = () => ko(tx.error);
  });
}
const kvLeggi = k => idb('kv', 'readonly', st => st.get(k));
const kvScrivi = (k, v) => idb('kv', 'readwrite', st => st.put(v, k));
const kvTogli = k => idb('kv', 'readwrite', st => st.delete(k));
const blobLeggi = id => idb('blob', 'readonly', st => st.get(id));
const blobScrivi = (id, bytes) => idb('blob', 'readwrite', st => st.put(bytes, id));
const blobTogli = id => idb('blob', 'readwrite', st => st.delete(id));
const blobChiavi = () => idb('blob', 'readonly', st => st.getAllKeys());

function archivioVuoto() {
  return { schema: SCHEMA, meta: { creato: adesso(), aggiornato: adesso() }, persone: [], voci: [], allegati: [], aree: [], registro: [], impostazioni: { agg: adesso(), blocco_min: 15 } };
}
function completa(a) {
  const v = archivioVuoto();
  for (const k of Object.keys(v)) if (a[k] == null) a[k] = v[k];
  return a;
}

/* --- Creazione, sblocco, blocco --- */
/* Prepara la cifratura locale con una frase nuova. L'archivio (S.A) lo imposta chi chiama. */
async function preparaLocale(frase, promemoria) {
  for (const k of await blobChiavi()) await blobTogli(k);
  await kvTogli('sporco');
  const grezza = casuale(32);
  S.testata = { promemoria, slot: [await creaSlot('frase', frase, grezza)], slot_agg: adesso() };
  S.chiaveGrezza = grezza; S.chiave = await importaChiaveDati(grezza);
  S.est = {}; S.disp = {}; S.estVoci = []; S.sporco = false;
}
async function creaArchivio(frase, promemoria, nomePersona, nascita) {
  await preparaLocale(frase, promemoria);
  S.A = archivioVuoto();
  S.A.persone.push({ id: uid(), nome: nomePersona, nascita: nascita || '', ruolo: 'titolare', creato: adesso(), agg: adesso() });
  S.sbloccato = true;
  await persisti();
}
/* Contenuto della busta locale: dalla versione 2 contiene archivio, dati esterni e impostazioni del dispositivo. */
function apriContenuto(x) {
  if (x && x.formato_locale === 2) return { A: completa(x.A), est: x.est || {}, disp: x.disp || {} };
  const A = completa(x), disp = {};
  if (A.impostazioni.github) { disp.github = A.impostazioni.github; delete A.impostazioni.github; }
  return { A, est: {}, disp };
}
async function apriBusta(busta, segreto, tipo) {
  if (!busta || busta.formato !== 'archivio-vita') throw new Error('Il file non è un archivio valido.');
  for (const slot of busta.slot.filter(x => x.tipo === tipo)) {
    try {
      const grezza = await apriSlot(slot, segreto);
      const chiave = await importaChiaveDati(grezza);
      return { grezza, chiave, ...apriContenuto(await dissigilla(busta, chiave)) };
    } catch (e) { /* segreto sbagliato per questo slot: provo il prossimo */ }
  }
  throw new Error(tipo === 'recupero' ? 'Codice di recupero non valido.' : 'Frase segreta non corretta.');
}
async function sblocca(busta, segreto, tipo) {
  const r = await apriBusta(busta, segreto, tipo);
  S.chiaveGrezza = r.grezza; S.chiave = r.chiave; S.A = r.A; S.est = r.est; S.disp = r.disp;
  ricostruisciEsterni();
  S.testata = { promemoria: busta.promemoria || '', slot: busta.slot, slot_agg: busta.slot_agg };
  S.sbloccato = true; S.ultimaAttivita = Date.now();
  S.sporco = !!(await kvLeggi('sporco'));
  const p = S.A.persone.filter(x => !x.canc);
  S.persona = p.length === 1 ? p[0].id : '';
}
function blocca() {
  if (S.chiaveGrezza) S.chiaveGrezza.fill(0);
  Object.assign(S, { sbloccato: false, chiave: null, chiaveGrezza: null, A: null, est: {}, disp: {}, estVoci: [], persona: '' });
  chiudiModale();
  disegna();
}

/* --- Salvataggio --- */
let _tSalva, _codaSalva = Promise.resolve();
async function persisti() {
  if (!S.sbloccato) return;
  const busta = await sigilla({ formato_locale: 2, A: S.A, est: S.est, disp: S.disp }, S.chiave, S.testata);
  await kvScrivi('busta', busta);
  return busta;
}
function salva(ridisegna = true) {
  S.A.meta.aggiornato = adesso();
  S.sporco = true; kvScrivi('sporco', 1);
  clearTimeout(_tSalva);
  _tSalva = setTimeout(() => { _codaSalva = _codaSalva.then(persisti).then(programmaSync).catch(e => avviso('Salvataggio non riuscito: ' + e.message, 'errore')); }, 250);
  if (ridisegna) disegna();
}
const salvaSubito = () => { clearTimeout(_tSalva); return (_codaSalva = _codaSalva.then(persisti)); };

/* --- Accesso ai dati --- */
const persone = () => S.A.persone.filter(p => !p.canc);
const nomePersona = id => (S.A.persone.find(p => p.id === id) || {}).nome || '';
const personaPredefinita = () => S.persona || (persone()[0] || {}).id || '';
function voci(area, tipo, tutti = false) {
  const filtro = v => !v.canc && v.area === area && (!tipo || v.tipo === tipo) && (tutti || !S.persona || !v.persona || v.persona === S.persona);
  const l = S.A.voci.filter(filtro);
  return area === 'salute' && S.estVoci.length ? l.concat(S.estVoci.filter(filtro)) : l;
}
/* Righe dei file garmin/*.csv trasformate in voci di sola lettura. */
function ricostruisciEsterni() {
  const titolare = (S.A.persone.find(p => !p.canc && p.ruolo === 'titolare') || S.A.persone.find(p => !p.canc) || {}).id || '';
  const out = [];
  for (const righe of Object.values((S.est && S.est.file) || {})) for (const [data, tipo, metrica, valore, unita] of righe) {
    out.push({ id: 'g-' + data + '-' + nomeFile(metrica), area: 'salute', tipo: tipo === 'corpo' ? 'corpo' : 'sensore', persona: titolare, data, metrica, valore, unita, fonte: 'Garmin', auto: true, creato: data });
  }
  S.estVoci = out;
}
const voce = id => S.A.voci.find(v => v.id === id && !v.canc);
function metti(v, ridisegna = true) {
  const t = adesso();
  if (!v.id) v.id = uid();
  if (!v.creato) v.creato = t;
  v.agg = t;
  const i = S.A.voci.findIndex(x => x.id === v.id);
  if (i >= 0) S.A.voci[i] = v; else S.A.voci.push(v);
  salva(ridisegna);
  return v;
}
/* Le cancellazioni lasciano una lapide (canc: true), così la sincronizzazione tra dispositivi non le fa riapparire. */
function togli(lista, id) {
  const i = S.A[lista].findIndex(x => x.id === id);
  if (i < 0) return;
  const x = S.A[lista][i];
  S.A[lista][i] = { id: x.id, area: x.area, tipo: x.tipo, canc: true, agg: adesso() };
  salva();
}
function annota(azione, origine, esito) {
  S.A.registro.push({ id: uid(), quando: adesso(), agg: adesso(), azione, origine, ...esito });
  if (S.A.registro.length > 400) S.A.registro.splice(0, S.A.registro.length - 400);
}
const allegati = () => S.A.allegati.filter(a => !a.canc && (!S.persona || !a.persona || a.persona === S.persona));

async function aggiungiAllegato(file, extra = {}) {
  const bytes = new Uint8Array(await leggiFile(file, 'bytes'));
  return aggiungiAllegatoBytes(bytes, { nome: file.name, mime: file.type || 'application/octet-stream', ...extra });
}
async function aggiungiAllegatoBytes(bytes, meta) {
  const id = meta.id || uid();
  await blobScrivi(id, await cifraBytes(bytes, S.chiave));
  const est = ((meta.nome || '').match(/\.[a-z0-9]{1,6}$/i) || ['.bin'])[0].toLowerCase();
  const a = { area: '', persona: personaPredefinita(), data: oggi(), stato: 'da elaborare', nota: '', rif: '', file: 'documenti/' + id + est, ...meta, id, dim: bytes.length, creato: meta.creato || adesso(), agg: adesso() };
  const i = S.A.allegati.findIndex(x => x.id === id);
  if (i >= 0) S.A.allegati[i] = a; else S.A.allegati.push(a);
  return a;
}
async function contenutoAllegato(a) {
  const c = await blobLeggi(a.id);
  if (c) return decifraBytes(c, S.chiave);
  if (ghPronto() && a.file) {
    const chiaro = await ghScaricaAllegato(a.file);
    if (chiaro) { await blobScrivi(a.id, await cifraBytes(chiaro, S.chiave)); return chiaro; }
  }
  throw new Error(ghPronto() ? 'Documento non trovato nel repository dei dati.' : 'Il contenuto di questo documento non è su questo dispositivo. Collega il repository dei dati per scaricarlo.');
}

/* --- Unione di due archivi: per ogni elemento vince la modifica più recente --- */
const LISTE = ['persone', 'voci', 'allegati', 'aree', 'registro'];
function unisci(locale, remoto) {
  let daRemoto = 0, daLocale = 0;
  const out = { schema: SCHEMA, meta: { creato: locale.meta.creato < remoto.meta.creato ? locale.meta.creato : remoto.meta.creato, aggiornato: adesso() } };
  for (const nome of LISTE) {
    const m = new Map((locale[nome] || []).map(x => [x.id, x]));
    const visti = new Set();
    for (const r of remoto[nome] || []) {
      visti.add(r.id);
      const l = m.get(r.id);
      if (!l || (r.agg || '') > (l.agg || '')) { m.set(r.id, r); daRemoto++; }
      else if ((l.agg || '') > (r.agg || '')) daLocale++;
    }
    for (const id of m.keys()) if (!visti.has(id)) daLocale++;
    out[nome] = [...m.values()];
  }
  const il = locale.impostazioni || {}, ir = remoto.impostazioni || {};
  if ((ir.agg || '') > (il.agg || '')) { out.impostazioni = ir; daRemoto++; } else { out.impostazioni = il; if ((il.agg || '') > (ir.agg || '')) daLocale++; }
  return { unito: out, daRemoto, daLocale };
}

/* --- Forma del file archivio.json: un elemento per riga, ordinati per id, così le modifiche nel repository si leggono riga per riga.
   strumenti/archivio.py nel repository dei dati scrive esattamente nello stesso modo. --- */
function serializza(A) {
  const d = x => JSON.stringify(x);
  const testa = ['{', ` "schema": ${d(A.schema || SCHEMA)},`, ` "meta": ${d(A.meta)},`, ` "impostazioni": ${d(A.impostazioni)},`];
  const liste = LISTE.map(n => {
    const el = [...(A[n] || [])].sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    return ` "${n}": [` + (el.length ? '\n' + el.map(x => '  ' + d(x)).join(',\n') + '\n ]' : ']');
  });
  return testa.join('\n') + '\n' + liste.join(',\n') + '\n}\n';
}

/* --- Esportazione in chiaro: il formato aperto da cui ricostruire tutto --- */
async function esportaChiaro(conAllegati) {
  const copia = JSON.parse(JSON.stringify(S.A));
  for (const n of LISTE) copia[n] = copia[n].filter(x => !x.canc);
  copia.esportato = adesso();
  if (conAllegati) for (const a of copia.allegati) {
    try { a.contenuto_base64 = b64(await contenutoAllegato(a)); } catch (e) { a.contenuto_mancante = true; }
  }
  return copia;
}
/* Importazione di un file nel formato aperto. mappaPersone: id nel file -> id nell'archivio ('' = crea). */
async function importaChiaro(dati, mappaPersone, origine) {
  const esito = { aggiunti: 0, aggiornati: 0, saltati: 0, errori: [] };
  const map = {};
  for (const p of dati.persone || []) {
    const dest = mappaPersone[p.id];
    if (dest) { map[p.id] = dest; const q = S.A.persone.find(x => x.id === dest); if (q && !q.nascita && p.nascita) { q.nascita = p.nascita; q.agg = adesso(); } }
    else { const n = { ...p, id: S.A.persone.some(x => x.id === p.id) ? uid() : p.id, creato: p.creato || adesso(), agg: adesso() }; S.A.persone.push(n); map[p.id] = n.id; esito.aggiunti++; }
  }
  const rimappa = x => (x.persona && map[x.persona] ? { ...x, persona: map[x.persona] } : x);
  const fondi = (lista, x) => {
    if (!x || !x.id) { esito.errori.push('Elemento senza identificativo ignorato.'); return false; }
    const i = S.A[lista].findIndex(y => y.id === x.id);
    if (i < 0) { S.A[lista].push({ creato: adesso(), ...x, agg: x.agg || adesso() }); esito.aggiunti++; return true; }
    if ((x.agg || '') > (S.A[lista][i].agg || '')) { S.A[lista][i] = x; esito.aggiornati++; return true; }
    esito.saltati++; return false;
  };
  for (const v of dati.voci || []) {
    if (!v.area || !v.tipo) { esito.errori.push(`Voce ${v.id || '?'} senza area o tipo: ignorata.`); continue; }
    fondi('voci', rimappa(v));
  }
  for (const a of dati.aree || []) fondi('aree', a);
  for (const a0 of dati.allegati || []) {
    const { contenuto_base64, contenuto_mancante, ...a } = rimappa(a0);
    const presente = S.A.allegati.find(y => y.id === a.id && !y.canc);
    if (contenuto_base64) {
      if (presente && (await blobLeggi(a.id))) { esito.saltati++; continue; }
      try { await aggiungiAllegatoBytes(daB64(contenuto_base64), a); esito.aggiunti++; }
      catch (e) { esito.errori.push(`Documento "${a.nome}" non caricato: ${e.message}`); }
    } else if (!presente && a.file) { S.A.allegati.push({ creato: adesso(), ...a, agg: a.agg || adesso() }); esito.aggiunti++; }
    else if (!presente) esito.errori.push(`Documento "${a.nome}" presente nell'elenco ma senza contenuto: non caricato.`);
    else esito.saltati++;
  }
  annota('Importazione file dati', origine, esito);
  salva();
  return esito;
}

/* ===== 4. Sincronizzazione con il repository privato dei dati =====
   Nel repository i file sono leggibili, così Claude e le automazioni possono lavorarci:
     archivio.json        l'archivio (scritto dalla pagina e da Claude)
     documenti/           gli originali dei documenti
     garmin/*.csv         dati del dispositivo, scritti ogni notte dall'automazione (sola lettura per la pagina)
     garmin/stato.json    esito dell'ultimo scaricamento
     rapporti/*.md        rapporti periodici scritti da Claude (sola lettura per la pagina)
   Sul dispositivo tutto resta cifrato con la frase segreta, token compreso. */
const GH = 'https://api.github.com';
const FILE_ARCHIVIO = 'archivio.json';
const gh = () => (S.disp && S.disp.github) || null;
const ghPronto = () => { const g = gh(); return !!(g && g.proprietario && g.repo && g.token); };

function ghUrl(g, percorso, conRef) {
  const p = percorso.split('/').map(encodeURIComponent).join('/');
  return `${GH}/repos/${encodeURIComponent(g.proprietario)}/${encodeURIComponent(g.repo)}/contents/${p}` + (conRef && g.ramo ? '?ref=' + encodeURIComponent(g.ramo) : '');
}
async function ghChiama(g, metodo, percorso, corpo, grezzo) {
  const r = await fetch(ghUrl(g, percorso, metodo === 'GET'), {
    method: metodo, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + g.token, Accept: grezzo ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  if (r.status === 404 && metodo === 'GET') return null;
  if (r.status === 401) throw new Error('GitHub rifiuta il token: è scaduto o errato. Creane uno nuovo e incollalo in Impostazioni.');
  if (r.status === 403) throw new Error('GitHub nega l\'accesso: il token non ha il permesso "Contents: read and write" su questo repository.');
  if (r.status === 404) throw new Error('Repository non trovato: controlla nome e permessi del token.');
  if (r.status === 409 || r.status === 422) { const e = new Error('conflitto'); e.conflitto = true; throw e; }
  if (!r.ok) throw new Error('GitHub ha risposto con errore ' + r.status + '.');
  return grezzo ? new Uint8Array(await r.arrayBuffer()) : r.json();
}
/* Distingue "repository inesistente o token senza accesso" da "repository vuoto". */
async function ghControllaRepo(g) {
  const r = await fetch(`${GH}/repos/${encodeURIComponent(g.proprietario)}/${encodeURIComponent(g.repo)}`, { cache: 'no-store', headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
  if (r.status === 401) throw new Error('GitHub rifiuta il token: è scaduto o errato.');
  if (r.status === 404 || r.status === 403) throw new Error(`Il repository "${g.proprietario}/${g.repo}" non esiste oppure il token non ha accesso: controlla utente, nome del repository e permessi del token.`);
  if (!r.ok) throw new Error('GitHub ha risposto con errore ' + r.status + '.');
}
async function ghLeggiTesto(g, percorso) {
  const b = await ghChiama(g, 'GET', percorso, null, true);
  return b ? decod.decode(b) : null;
}
async function ghLeggiArchivio(g) {
  const j = await ghChiama(g, 'GET', FILE_ARCHIVIO);
  if (!j) return null;
  const testo = j.content ? decod.decode(daB64(j.content)) : await ghLeggiTesto(g, FILE_ARCHIVIO);
  let A;
  try { A = JSON.parse(testo); } catch (e) { throw new Error('archivio.json nel repository non è un JSON valido: non lo tocco. Va corretto a mano o da Claude.'); }
  if (!A || !String(A.schema || '').startsWith('archivio-vita/')) throw new Error('archivio.json nel repository non è nel formato dell\'archivio: non lo tocco.');
  return { sha: j.sha, A: completa(A) };
}
function ghScrivi(g, percorso, bytes, sha, messaggio) {
  const corpo = { message: messaggio, content: b64(bytes) };
  if (sha) corpo.sha = sha;
  if (g.ramo) corpo.branch = g.ramo;
  return ghChiama(g, 'PUT', percorso, corpo);
}
async function ghScaricaAllegato(percorso) {
  try { return await ghChiama(gh(), 'GET', percorso, null, true); } catch (e) { return null; }
}
const elencoCartella = async (g, c) => ((await ghChiama(g, 'GET', c)) || []).filter(x => x.type === 'file');

let _tSync, _inSync = false;
function programmaSync() {
  if (!S.sbloccato || !ghPronto()) return;
  clearTimeout(_tSync);
  _tSync = setTimeout(() => sincronizza(false), 4000);
}
function statoSync(stato, errore = '') {
  S.sync.stato = stato; S.sync.errore = errore;
  if (stato === 'ok') S.sync.ultimo = adesso();
  const el = $('#stato-sync'); if (el) el.replaceWith(spiaSync());
}
async function sincronizza(manuale) {
  if (!ghPronto()) { if (manuale) avviso('Repository dei dati non collegato: vai in Impostazioni.', 'errore'); return; }
  if (_inSync) return;
  if (!navigator.onLine) { statoSync('errore', 'Sei offline: le modifiche restano su questo dispositivo e partiranno alla prossima connessione.'); return; }
  _inSync = true; statoSync('in corso');
  const g = gh();
  try {
    await salvaSubito();
    let fatto = false, cambiato = false;
    for (let giro = 0; giro < 4 && !fatto; giro++) {
      const remoto = await ghLeggiArchivio(g);
      if (!remoto) { await ghScrivi(g, FILE_ARCHIVIO, cod.encode(serializza(S.A)), null, 'Primo salvataggio dalla pagina'); fatto = true; break; }
      const u = unisci(S.A, remoto.A);
      if (u.daRemoto > 0) { S.A = u.unito; cambiato = true; }
      if (u.daLocale > 0) {
        try { await ghScrivi(g, FILE_ARCHIVIO, cod.encode(serializza(u.unito)), remoto.sha, 'Modifica dalla pagina'); S.A = u.unito; fatto = true; }
        catch (e) { if (!e.conflitto) throw e; /* qualcun altro ha scritto nel frattempo: rileggo e riunisco */ }
      } else fatto = true;
    }
    if (!fatto) throw new Error('Troppi tentativi in conflitto con un\'altra modifica: riprova tra poco.');
    const esitoDoc = await sincronizzaAllegati(g);
    if (await leggiEsterni(g)) cambiato = true;
    await persisti();
    S.sporco = false; await kvTogli('sporco');
    statoSync('ok');
    if (cambiato) disegna();
    if (manuale) avviso('Sincronizzato.' + (esitoDoc.caricati ? ` Documenti inviati: ${esitoDoc.caricati}.` : ''), 'ok');
  } catch (e) {
    statoSync('errore', e.message === 'Failed to fetch' ? 'Impossibile raggiungere GitHub: controlla la connessione.' : e.conflitto ? 'GitHub ha rifiutato la scrittura per un conflitto: riprova tra poco.' : e.message);
    if (manuale) avviso(S.sync.errore, 'errore');
  } finally { _inSync = false; }
}
async function sincronizzaAllegati(g) {
  const esito = { caricati: 0, rimossi: 0 };
  const remoti = new Map((await elencoCartella(g, 'documenti')).map(x => ['documenti/' + x.name, x.sha]));
  const locali = new Set(await blobChiavi());
  for (const a of S.A.allegati) {
    const file = a.file;
    if (a.canc) {
      if (locali.has(a.id)) await blobTogli(a.id);
      const f = file || [...remoti.keys()].find(k => k.startsWith('documenti/' + a.id + '.'));
      if (f && remoti.has(f)) { const c = { message: 'Rimozione documento', sha: remoti.get(f) }; if (g.ramo) c.branch = g.ramo; await ghChiama(g, 'DELETE', f, c); remoti.delete(f); esito.rimossi++; }
    } else if (file && locali.has(a.id) && !remoti.has(file)) {
      await ghScrivi(g, file, await decifraBytes(await blobLeggi(a.id), S.chiave), null, 'Nuovo documento: ' + (a.nome || a.id));
      esito.caricati++;
    }
  }
  return esito;
}
/* Garmin e rapporti: si riscaricano solo i file cambiati (GitHub dà un'impronta per ogni file). */
function leggiCsvGarmin(testo) {
  const { intestazioni, righe } = leggiCsv(testo);
  const i = n => intestazioni.indexOf(n);
  const [id, it, im, iv, iu] = ['data', 'tipo', 'metrica', 'valore', 'unita'].map(i);
  return righe.map(r => [r[id], it >= 0 ? r[it] : 'sensore', r[im], Number(r[iv]), iu >= 0 ? r[iu] : '']).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r[0]) && r[2] && isFinite(r[3]));
}
async function leggiEsterni(g) {
  const E = S.est; let cambiato = false;
  E.file = E.file || {}; E.sha = E.sha || {}; E.rapporti = E.rapporti || {};
  const garmin = await elencoCartella(g, 'garmin');
  const visti = new Set();
  for (const f of garmin.filter(x => /\.csv$/i.test(x.name))) {
    visti.add(f.name);
    if (E.sha[f.name] === f.sha && E.file[f.name]) continue;
    E.file[f.name] = leggiCsvGarmin(await ghLeggiTesto(g, 'garmin/' + f.name)); E.sha[f.name] = f.sha; cambiato = true;
  }
  for (const n of Object.keys(E.file)) if (!visti.has(n)) { delete E.file[n]; delete E.sha[n]; cambiato = true; }
  const st = garmin.find(x => x.name === 'stato.json');
  if (st && st.sha !== E.statoSha) {
    try { E.stato = JSON.parse(await ghLeggiTesto(g, 'garmin/stato.json')); } catch (e) { E.stato = { esito: 'errore', messaggio: 'garmin/stato.json non leggibile' }; }
    E.statoSha = st.sha; cambiato = true;
  }
  const rap = (await elencoCartella(g, 'rapporti')).filter(x => /\.md$/i.test(x.name));
  const nomi = new Set(rap.map(x => x.name));
  for (const f of rap) {
    const r = E.rapporti[f.name];
    if (r && r.sha === f.sha) continue;
    E.rapporti[f.name] = { sha: f.sha, testo: await ghLeggiTesto(g, 'rapporti/' + f.name) }; cambiato = true;
  }
  for (const n of Object.keys(E.rapporti)) if (!nomi.has(n)) { delete E.rapporti[n]; cambiato = true; }
  if (cambiato) ricostruisciEsterni();
  return cambiato;
}

function grafico(descrizione, disegnaFn) {
  const box = h('div', { class: 'grafico', role: 'img', 'aria-label': descrizione });
  const ro = new ResizeObserver(() => {
    const w = Math.floor(box.clientWidth);
    if (w > 0 && w !== box._w) { box._w = w; box.replaceChildren(...disegnaFn(w)); }
  });
  ro.observe(box);
  return box;
}
function tacche(min, max, quante = 4) {
  if (min === max) { min -= 1; max += 1; }
  const grezzo = (max - min) / quante, mag = Math.pow(10, Math.floor(Math.log10(grezzo)));
  const passo = [1, 2, 2.5, 5, 10].map(m => m * mag).find(p => p >= grezzo) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(min / passo) * passo; v <= max + passo * 1e-9; v += passo) out.push(Math.round(v / passo) * passo);
  return out;
}

function mostraFumetto(f, x, y, w, righe) {

/* --- Scadenze --- */
function creaIcs(lista) {
  const righe = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Archivio di vita//IT'];
  const freq = { mensile: 'FREQ=MONTHLY', trimestrale: 'FREQ=MONTHLY;INTERVAL=3', semestrale: 'FREQ=MONTHLY;INTERVAL=6', annuale: 'FREQ=YEARLY' };

    if (x.nota) righe.push(`DESCRIPTION:${pulisci(x.nota)}`);
    if (freq[x.ripeti]) righe.push('RRULE:' + freq[x.ripeti]);
    righe.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Promemoria', 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  }
  righe.push('END:VCALENDAR');
  return righe.join('\r\n');
}

      h('p', { class: 'attenuato piccolo' }, 'Le credenziali restano nella cassaforte di GitHub: non le vede la pagina, non le vede Claude e non compaiono nel repository. Da lì in poi lo scaricamento parte da solo ogni notte.')),
    h('p', { class: 'piccolo' }, linkGh(g, 'actions', 'Vedi le esecuzioni su GitHub')));
}

  const el = (name, etich, val, extra = {}) => h('label', { class: 'campo' }, h('span', {}, etich), h('input', { name, value: val || '', autocomplete: 'off', spellcheck: 'false', ...extra }));

      ghPronto() ? btn('Scollega', async () => { if (confirm('Scollegare questo dispositivo? I dati restano nel repository e qui, ma smettono di sincronizzarsi.')) { S.disp.github = null; await salvaSubito(); disegna(); } }) : null));
  const inclDoc = h('input', { type: 'checkbox', checked: true });
  const formFrase = h('form', { class: 'modulo', onsubmit: async e => {
    e.preventDefault(); const f = formFrase.elements;
    if (f.nuova.value !== f.ripeti.value) { avviso('Le due frasi non coincidono.', 'errore'); return; }
    if (normFrase(f.nuova.value).length < 4) { avviso('Frase troppo corta.', 'errore'); return; }
    S.testata.slot = [await creaSlot('frase', f.nuova.value, S.chiaveGrezza)];
    S.testata.promemoria = f.promemoria.value.trim(); S.testata.slot_agg = adesso();
    await salvaSubito(); formFrase.reset(); avviso('Frase segreta cambiata su questo dispositivo.');
  } },
    el('nuova', 'Nuova frase segreta', '', { type: 'password', required: true, autocomplete: 'new-password' }), el('ripeti', 'Ripeti la frase', '', { type: 'password', required: true, autocomplete: 'new-password' }),
    h('label', { class: 'campo intero' }, h('span', {}, 'Promemoria mostrato allo sblocco (visibile a chiunque apra la pagina)'), h('input', { name: 'promemoria', value: S.testata.promemoria || '' })),
    h('div', { class: 'azioni intero' }, h('button', { class: 'btn', type: 'submit' }, 'Cambia frase segreta')));
  const nomeArea = h('input', { placeholder: 'es. Formazione, Casa, Auto', 'aria-label': 'Nome della nuova cartella' });
  const stSync = !ghPronto() ? stato('ritardo', 'Non collegato: i dati sono solo su questo dispositivo') : S.sync.stato === 'errore' ? stato('ritardo', S.sync.errore) : stato('ok', S.sync.ultimo ? 'Ultima sincronizzazione ' + fmtQuando(S.sync.ultimo) : 'Collegato');
  return h('div', {},
    h('div', { class: 'testa' }, h('h1', {}, 'Impostazioni')),
    pannello('Persone', h('ul', { class: 'elenco' }, pp.map(p => h('li', { class: 'tra' }, h('span', {}, h('strong', {}, p.nome), h('span', { class: 'attenuato' }, ` ${p.ruolo || ''}` + (p.nascita ? `, ${fmtData(p.nascita)}` : ''))), btn('Modifica', () => modificaPersona(p), 'piccolo')))),
      h('div', { class: 'azioni' }, btn('Aggiungi una persona', () => modificaPersona(null))), h('p', { class: 'attenuato piccolo' }, 'Ogni voce appartiene a una persona. Con più persone compare in alto il selettore per vedere una sola persona o tutta la famiglia.')),
    pannello('Cartelle personalizzate', S.A.aree.filter(a => !a.canc).length ? h('ul', { class: 'elenco' }, S.A.aree.filter(a => !a.canc).map(a => h('li', { class: 'tra' }, h('strong', {}, a.nome), btn('Elimina', () => { const n = voci(a.id, null, true).length; if (confirm(n ? `La cartella contiene ${n} voci, che non saranno più visibili. Eliminare?` : 'Eliminare la cartella?')) togli('aree', a.id); }, 'piccolo')))) : null,
      h('div', { class: 'azioni' }, nomeArea, btn('Crea cartella', () => { const n = nomeArea.value.trim(); if (!n) return; S.A.aree.push({ id: 'x-' + uid().slice(0, 8), nome: n, creato: adesso(), agg: adesso() }); salva(); })),
      h('p', { class: 'attenuato piccolo' }, 'Le cartelle già previste (finanze, patrimonio, organizzazione, salute, sport, mindfulness, lettura, viaggi, progetti) hanno cruscotti dedicati. Una cartella personalizzata raccoglie voci libere con data, categoria e valore.')),
    pannello('Repository dei dati', h('p', {}, stSync), formGh,
      h('details', {}, h('summary', {}, 'Come si crea il token'), h('ol', { class: 'largo-testo' },
        h('li', {}, 'Su GitHub: foto del profilo, Settings, Developer settings, Personal access tokens, Fine-grained tokens, Generate new token.'),

      h('p', { class: 'attenuato piccolo' }, 'Formato aperto e leggibile, descritto nel LEGGIMI: serve per spostare i dati in qualunque sistema futuro. Il file non è protetto: conservalo con cura.'),
      h('div', { class: 'azioni' }, btn('Importa un file dati (.json)', () => scegliFile('.json,application/json', scegliImportaDati))),
      h('p', { class: 'attenuato piccolo' }, 'Per caricare dati preparati altrove nello stesso formato. Al termine vedi quante voci sono entrate e quali no.')),
    pannello('Sicurezza di questo dispositivo', formFrase,
      h('label', { class: 'campo stretto' }, h('span', {}, 'Blocco automatico dopo minuti di inattività'), h('input', { type: 'number', min: 1, max: 240, value: S.A.impostazioni.blocco_min || 15, onchange: e => { S.A.impostazioni.blocco_min = Math.max(1, +e.target.value || 15); toccaImpostazioni(); salva(false); } }))),
    pannello('Questo dispositivo', h('p', { class: 'attenuato piccolo' }, 'Rimuove l\'archivio solo da questo browser. Il repository dei dati non viene toccato.'),
      h('div', { class: 'azioni' }, btn('Rimuovi l\'archivio da questo dispositivo', async () => { if (!confirm(ghPronto() && !S.sporco ? 'Rimuovere l\'archivio da questo dispositivo?' : 'ATTENZIONE: ci sono dati che esistono solo qui e andranno persi. Rimuovere comunque?')) return; await kvTogli('busta'); await kvTogli('sporco'); for (const k of await blobChiavi()) await blobTogli(k); blocca(); }, 'pericolo'))));
}

/* ===== 10. Schermata di sblocco e avvio ===== */
let _modoBlocco = '';
async function dopoSblocco() {
  _modoBlocco = '';
  S.ultimaAttivita = Date.now();
  disegna();
  if (ghPronto()) sincronizza(false);
}
async function schermataBlocco() {
  const busta = await kvLeggi('busta');
  const modo = _modoBlocco || (busta ? 'apri' : 'benvenuto');
  const vai = m => { _modoBlocco = m; schermataBlocco().then(el => $('#app').replaceChildren(el)); };
  const err = h('div', { class: 'errore', role: 'alert' });
  const attesa = (form, si) => { const b = form.querySelector('button[type=submit]'); b.disabled = si; if (si) { b.dataset.t = b.textContent; b.textContent = 'Un momento…'; } else if (b.dataset.t) b.textContent = b.dataset.t; };
  const campo = (name, etich, extra = {}) => h('label', { class: 'campo intero' }, h('span', {}, etich), h('input', { name, autocomplete: 'off', spellcheck: 'false', ...extra }));
  const cornice = (...kids) => h('div', { class: 'blocco' }, h('div', { class: 'blocco-scheda' }, h('div', { class: 'marchio grande' }, 'Archivio'), kids));
  const invio = (form, fn) => async e => { e.preventDefault(); err.textContent = ''; attesa(form, true); try { await fn(form.elements); } catch (ex) { err.textContent = ex.message === 'Failed to fetch' ? 'Impossibile raggiungere GitHub: controlla la connessione.' : ex.message; attesa(form, false); } };
  const campiFrase = () => {
    const forza = h('div', { class: 'forza intero' });
    return [
      campo('frase', 'Frase segreta per aprire la pagina su questo dispositivo', { type: 'password', required: true, autocomplete: 'new-password', oninput: e => { const f = forzaFrase(e.target.value); forza.textContent = f ? f.testo : ''; forza.className = 'forza intero ' + (f ? f.livello : ''); } }), forza,
      campo('ripeti', 'Ripeti la frase segreta', { type: 'password', required: true, autocomplete: 'new-password' }),
      campo('promemoria', 'Promemoria (facoltativo, visibile a chiunque apra la pagina)', { placeholder: 'Una domanda che solo tu sai collegare alla frase' }),
    ];
  };
  const controllaFrase = el => {
    if (el.frase.value !== el.ripeti.value) throw new Error('Le due frasi non coincidono.');
    if (normFrase(el.frase.value).length < 4) throw new Error('La frase segreta deve avere almeno 4 caratteri.');
  };

  if (modo === 'apri') {
    const form = h('form', { class: 'modulo' },
      busta.promemoria ? h('p', { class: 'promemoria intero' }, 'Promemoria: ' + busta.promemoria) : null,
      campo('segreto', 'Frase segreta', { type: 'password', required: true, autocomplete: 'current-password' }), err,
      h('div', { class: 'azioni intero' }, h('button', { class: 'btn primario', type: 'submit' }, 'Sblocca')));
    form.onsubmit = invio(form, async el => { await sblocca(busta, el.segreto.value, 'frase'); await dopoSblocco(); });
    setTimeout(() => { const i = form.elements.segreto; if (i) i.focus(); });
    return cornice(h('p', { class: 'sotto' }, 'Su questo dispositivo i dati sono cifrati. Si aprono solo con la tua frase.'), form,
      h('p', { class: 'collegamenti' }, btn('Ho dimenticato la frase', () => vai('dimenticata'), 'piatto'), btn('Collega un altro archivio', () => vai('collega'), 'piatto')));
  }
  if (modo === 'dimenticata') {
    const nonInviate = !!(await kvLeggi('sporco'));
    return cornice(h('h2', {}, 'Frase dimenticata'),
      h('p', {}, 'La frase protegge solo la copia su questo dispositivo. L\'archivio vero è nel tuo repository dei dati: ricollega il dispositivo con il token di GitHub e scegli una frase nuova.'),
      nonInviate ? h('p', { class: 'errore' }, 'Attenzione: su questo dispositivo ci sono modifiche non ancora inviate al repository. Ricollegandolo andranno perse.') : null,
      h('div', { class: 'azioni' }, btn('Ricollega il dispositivo', () => vai('collega'), 'primario'), btn('Indietro', () => vai('apri'), 'piatto')));
  }
  if (modo === 'benvenuto') {
    return cornice(h('p', { class: 'sotto' }, 'Il tuo archivio personale: salute, finanze, patrimonio, viaggi e progetti. I dati vivono nel tuo repository privato su GitHub; su questo dispositivo restano cifrati con una frase che conosci solo tu.'),
      h('div', { class: 'azioni colonna' }, btn('Collega il mio archivio', () => vai('collega'), 'primario')),
      h('p', { class: 'collegamenti' }, btn('Prova senza repository', () => vai('nuovo'), 'piatto')));
  }
  if (modo === 'nuovo') {
    const form = h('form', { class: 'modulo' }, campo('nome', 'Il tuo nome', { required: true }), campo('nascita', 'Data di nascita (facoltativa)', { type: 'date' }), campiFrase(), err,
      h('div', { class: 'azioni intero' }, h('button', { class: 'btn primario', type: 'submit' }, 'Crea l\'archivio'), btn('Indietro', () => vai(busta ? 'apri' : 'benvenuto'), 'piatto')));
    form.onsubmit = invio(form, async el => {
      controllaFrase(el);
      if (busta && !confirm('Su questo dispositivo c\'è già un archivio: verrà sostituito qui. Continuare?')) { attesa(form, false); return; }
      await creaArchivio(el.frase.value, el.promemoria.value.trim(), el.nome.value.trim(), el.nascita.value);
      await dopoSblocco();
    });
    return cornice(h('h2', {}, 'Archivio solo su questo dispositivo'), h('p', { class: 'sotto' }, 'Utile per provare. Puoi collegare il repository in qualunque momento da Impostazioni: i dati inseriti qui si uniscono a quelli già presenti.'), form);
  }
  /* modo collega: primo avvio, dispositivo nuovo o frase dimenticata */
  const form = h('form', { class: 'modulo' },
    campo('proprietario', 'Utente GitHub', { required: true, autocapitalize: 'none' }), campo('repo', 'Repository privato dei dati', { required: true, value: 'archivio-dati', autocapitalize: 'none' }),
    campo('token', 'Token di accesso', { type: 'password', required: true }), campiFrase(),
    campo('nome', 'Il tuo nome (serve solo se il repository è ancora vuoto)'), err,
    h('div', { class: 'azioni intero' }, h('button', { class: 'btn primario', type: 'submit' }, 'Collega e apri'), btn('Indietro', () => vai(busta ? 'apri' : 'benvenuto'), 'piatto')));
  form.onsubmit = invio(form, async el => {
    controllaFrase(el);
    const g = { proprietario: el.proprietario.value.trim(), repo: el.repo.value.trim(), ramo: '', token: el.token.value.trim() };
    await ghControllaRepo(g);
    const remoto = await ghLeggiArchivio(g);
    if (!remoto && !el.nome.value.trim()) throw new Error('Il repository è vuoto: scrivi il tuo nome per creare l\'archivio.');
    if (busta && !confirm('L\'archivio già presente su questo dispositivo verrà sostituito da quello del repository. Continuare?')) { attesa(form, false); return; }
    if (remoto) { await preparaLocale(el.frase.value, el.promemoria.value.trim()); S.A = remoto.A; }
    else await creaArchivio(el.frase.value, el.promemoria.value.trim(), el.nome.value.trim(), '');
    S.disp.github = g; S.sbloccato = true;
    const p = persone(); S.persona = p.length === 1 ? p[0].id : '';
    ricostruisciEsterni();
    await persisti();
    await dopoSblocco();
  });
  return cornice(h('h2', {}, 'Collega il tuo archivio'),
    h('p', { class: 'sotto' }, 'Servono il tuo utente GitHub, il nome del repository dei dati e un token di accesso. La guida per il token è nel LEGGIMI.'), form);
}

['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { S.ultimaAttivita = Date.now(); }, { passive: true }));
setInterval(() => { if (S.sbloccato && Date.now() - S.ultimaAttivita > (S.A.impostazioni.blocco_min || 15) * 60000) { salvaSubito().finally(blocca); } }, 20000);
window.addEventListener('online', programmaSync);
document.addEventListener('visibilitychange', () => {
  if (!S.sbloccato) return;
  if (document.hidden) salvaSubito().catch(() => {});
  else if (ghPronto()) programmaSync();
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (!window.isSecureContext || !crypto.subtle) document.getElementById('app').textContent = 'Questa pagina va aperta da un indirizzo https (o da localhost): senza, il browser non permette la cifratura.';
else disegna();
